name: Lucas Web V2 | Prévia GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lucasweb-pages-preview
  cancel-in-progress: true

jobs:
  build:
    name: Gerar versão estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Instalar dependências travadas
        run: bun ci
      - name: Gerar site sem backend nem analytics
        run: bun run build:pages
      - name: Validar saída
        run: |
          test -s github-pages/index.html
          test -f github-pages/.nojekyll
          test -d github-pages/assets
          ! grep -qi 'runable.js' github-pages/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages

  deploy:
    name: Publicar apenas prévia
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
