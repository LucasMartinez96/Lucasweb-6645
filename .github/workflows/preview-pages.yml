name: Lucas Web V2 | Prévia GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lucasweb-pages-preview
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e disponibilizar pacote de prévia
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Instalar dependências travadas
        run: bun ci
      - name: Gerar versão estática sem analytics
        run: bun run build:pages
      - name: Validar arquivos
        run: |
          test -s github-pages/index.html
          test -f github-pages/.nojekyll
          test -d github-pages/assets
          ! grep -qi 'runable.js' github-pages/index.html
      - name: Arquivar prévia estática para revisão
        uses: actions/upload-artifact@v4
        with:
          name: lucasweb-v2-preview-estatica
          path: github-pages/
          include-hidden-files: true
          retention-days: 14
      # O usuário precisa ativar GitHub Pages uma vez em Settings > Pages.
      - name: Verificar se Pages já foi ativado
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Preparar artefato do Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages/

  deploy:
    name: Publicar somente quando Pages estiver ativo
    needs: build
    if: needs.build.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
